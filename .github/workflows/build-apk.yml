name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: auto-hotspot-bt-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publicar APK como release "latest-debug"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk auto-hotspot-bt-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug auto-hotspot-bt-debug.apk \
            --title "APK de depuración (último build de main)" \
            --notes "Compilado automáticamente desde ${{ github.sha }}." \
            --prerelease
