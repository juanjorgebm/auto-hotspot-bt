<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
  #p { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  // Reproductor OFICIAL de YouTube (IFrame Player API). Solo JavaScript ES5 para que
  // funcione con el WebView antiguo de Android 5.1.
  var player = null, ready = false, pending = null;
  var ORIGIN = "__ORIGIN__";

  // Cada método se llama con el número exacto de argumentos que espera Android.
  function send(fn, a, b) {
    try {
      if (fn === 'onReady') Android.onReady();
      else if (fn === 'onTime') Android.onTime(a, b);
      else Android[fn](a);
    } catch (e) {}
  }

  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () { send('onError', -1); };
  document.head.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('p', {
      width: '100%', height: '100%',
      host: 'https://www.youtube.com',
      playerVars: {
        autoplay: 1, playsinline: 1, controls: 1, rel: 0, fs: 0,
        iv_load_policy: 3, origin: ORIGIN, widget_referrer: ORIGIN
      },
      events: {
        onReady: function () {
          ready = true;
          send('onReady');
          if (pending) { player.loadVideoById(pending.id, pending.start); pending = null; }
        },
        onStateChange: function (e) { send('onState', e.data); },
        onError: function (e) { send('onError', e.data); }
      }
    });
    setInterval(function () {
      if (!ready || !player || !player.getCurrentTime) return;
      try { send('onTime', player.getCurrentTime() || 0, player.getDuration() || 0); } catch (e) {}
    }, 200);
  }

  function loadVideo(id, start) {
    if (ready) player.loadVideoById(id, start || 0); else pending = { id: id, start: start || 0 };
  }
  function playV() { if (ready) player.playVideo(); }
  function pauseV() { if (ready) player.pauseVideo(); }
  function seekV(s) { if (ready) player.seekTo(s, true); }
</script>
</body>
</html>
